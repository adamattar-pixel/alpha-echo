services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: alpha_echo
      POSTGRES_USER: alpha_echo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your own local PostgreSQL password before using Compose}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_echo -d alpha_echo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - alpha_echo_postgres:/var/lib/postgresql/data

volumes:
  alpha_echo_postgres:
